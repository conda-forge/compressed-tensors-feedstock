schema_version: 1

context:
  name: compressed-tensors
  version: "0.19.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: c66f72f121df8970722f708bc2ca719dc1c869004d4fbf6294403b2de1049749

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - setuptools-scm ==8.2.0
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=2.10.0
    - transformers >=4.45.0
    - pydantic >=2.0
    - loguru
    - psutil

tests:
  - python:
      imports:
        - compressed_tensors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Library for utilization of compressed safetensors of neural network models
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/neuralmagic/compressed-tensors

extra:
  recipe-maintainers:
    - timkpaine
    - maresb
